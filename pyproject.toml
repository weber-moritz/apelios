[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "apelios"
version = "0.1.0"
description = "A modular, low-latency control pipeline for moving-head lighting fixtures."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aioartnet==0.2.1",
    "nats-py>=2.7",
    "nats-server-bin>=2.12.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "pytest-cov",
]
performance = [
    "matplotlib",
    "pandas",
    "seaborn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apelios = [
    "fixture/patch/*.json",
    "output/config/*.json",
    "router/routing/*.json",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that require external services (nats-server, etc)",
    "e2e: end-to-end tests that exercise full workflows",
]
